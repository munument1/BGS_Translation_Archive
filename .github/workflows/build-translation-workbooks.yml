name: Build Untranslated Book Workspaces

on:
  push:
    paths:
      - "tools/build_translation_workbooks.py"
      - "docs/books/imperial_game_books_catalog.json"
      - ".github/workflows/build-translation-workbooks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: untranslated-book-workspaces
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources and keep working files
        uses: actions/checkout@v4
      - name: Build book-by-book workspaces without copying external text
        run: |
          python3 tools/build_translation_workbooks.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/untranslated')
          source=json.loads(Path('docs/books/imperial_game_books_catalog.json').read_text(encoding='utf-8'))
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['total']==source['total'] and m['total']>=4800
          for game,d in m['games'].items():
              paths=list((root/game/'books').rglob('*.md'))
              assert len(paths)>=d['books'], (game,len(paths),d)
              names={p.as_posix().casefold() for p in paths}
              assert len(names)==len(paths)
              index=(root/game/'index.md').read_text(encoding='utf-8')
              assert index.count('](') >= d['books']
              for p in paths:
                  content=p.read_text(encoding='utf-8')
                  assert '**원문 본문:** 미수록' in content
                  assert '## 한국어 번역' in content
              print(game,len(paths),'workbooks')
          PY
      - name: Commit only new templates and updated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/untranslated
          if ! git diff --cached --quiet; then
            git commit -m "docs: create per-book untranslated translation workspaces"
            git pull --rebase origin main
            git push
          else
            echo "No new untranslated workbooks."
          fi

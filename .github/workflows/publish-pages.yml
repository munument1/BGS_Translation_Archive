name: Publish Tamriel Library Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm complete static library
        run: |
          test -f docs/index.html
          test -f docs/assets/library.css
          test -f docs/assets/library.js
          test -f docs/books/catalog.json
          test -f docs/books/fulltext-index.json
          node --check docs/assets/library.js
          test -f docs/books/external_candidates.json
          test -f docs/books/imperial_game_books_catalog.json
          test -f docs/untranslated/lookup.json
          test -f docs/untranslated/manifest.json
          test -f docs/untranslated/README.md
          test -f docs/imperial-library.html
          test -f docs/assets/external-references.js
          node --check docs/assets/external-references.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/books')
          c=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          assert len(c['books'])>=1600
          missing=[b['path'] for b in c['books'] if not (root/b['path']).is_file()]
          print('Verified catalog entries: '+str(len(c['books']))+', missing files: '+str(len(missing)))
          assert not missing, missing[:10]
          ext=json.loads((root/'imperial_game_books_catalog.json').read_text(encoding='utf-8'))
          assert ext['total'] >= 2600
          assert ext['counts']['eso'] >= 2500
          assert len(ext['entries']) == ext['total']
          look=json.loads(Path('docs/untranslated/lookup.json').read_text(encoding='utf-8'))['workbooks']
          assert len(look)==ext['total']
          assert all((Path('docs/untranslated')/path).is_file() for path in look.values())
          assert all(not row['full_text_included'] and row['status']=='bibliography_only' for row in ext['entries'])
          references=json.loads((root/'external_candidates.json').read_text(encoding='utf-8'))
          assert len(references['items']) >= 7
          assert all(row['url'].startswith('https://www.imperial-library.info/content/') for row in references['items'])
          assert all(row['status']=='external_reference_only' and not row['text_republished'] for row in references['items'])
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs as a static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

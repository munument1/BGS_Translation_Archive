name: Import Unofficial Oblivion Translation Memory
on:
  push:
    paths:
      - "tools/import_unofficial_oblivion.py"
      - ".github/workflows/import-unofficial-oblivion.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import isolated unofficial patch memory
        run: python3 tools/import_unofficial_oblivion.py
      - name: Commit separate archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Oblivion/Mods/UnofficialPatches/
          if ! git diff --cached --quiet; then
            git commit -m "data: archive unofficial Oblivion patch strings separately"
            for i in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
